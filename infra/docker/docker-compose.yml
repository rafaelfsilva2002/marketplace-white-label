version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: marketplace-postgres
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: marketplace-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    container_name: marketplace-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:3001/api/v1
    ports:
      - '3000:3000'
    depends_on:
      - api
    restart: unless-stopped

  workers:
    build:
      context: ../../
      dockerfile: apps/workers/Dockerfile
    container_name: marketplace-workers
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
