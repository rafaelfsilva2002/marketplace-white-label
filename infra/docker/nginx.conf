# ─── Marketplace Production Nginx Configuration ─────────────────
# Reverse proxy for API (NestJS) and Web (Next.js) services
# SSL termination, rate limiting, security headers, and WebSocket support

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstreams
upstream api {
  server api:3001;
  keepalive 32;
}

upstream web {
  server web:3000;
  keepalive 16;
}

# Shared proxy headers map
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ─── HTTP → HTTPS redirect ──────────────────────────────────────
server {
  listen 80;
  server_name _;

  # Allow health checks on HTTP
  location /health {
    proxy_pass http://api/health;
    proxy_set_header Host $host;
  }

  # ACME challenge for Let's Encrypt
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect everything else to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ─── HTTPS server ───────────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name _;

  # ── SSL Configuration ──────────────────────────────────────────
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # OCSP Stapling
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 8.8.8.8 8.8.4.4 valid=300s;
  resolver_timeout 5s;

  # ── Security Headers ───────────────────────────────────────────
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  # ── Connection limits ──────────────────────────────────────────
  limit_conn conn_limit 50;

  # ── Request size ───────────────────────────────────────────────
  client_max_body_size 10M;

  # ── Gzip ───────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 4;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

  # ── Frontend (Next.js) ─────────────────────────────────────────
  location / {
    limit_req zone=web_limit burst=20 nodelay;

    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
  }

  # Next.js static assets — long-lived cache
  location /_next/static/ {
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";

    expires 365d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # ── API ────────────────────────────────────────────────────────
  location /api/ {
    limit_req zone=api_limit burst=10 nodelay;

    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";

    # Timeouts — API may have longer processing
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # No buffering for API responses (streaming support)
    proxy_buffering off;
  }

  # ── Auth endpoints — stricter rate limiting ────────────────────
  location /api/auth/ {
    limit_req zone=auth_limit burst=3 nodelay;

    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  # ── Health check ───────────────────────────────────────────────
  location /health {
    proxy_pass http://api/health;
    proxy_set_header Host $host;
    access_log off;
  }

  # ── Metrics (internal only) ────────────────────────────────────
  location /metrics {
    deny all;
    return 403;
  }

  # ── WebSocket — Notifications ──────────────────────────────────
  location /notifications {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket timeouts — longer for persistent connections
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
  }

  # ── Block common exploit paths ─────────────────────────────────
  location ~ /\. {
    deny all;
    return 404;
  }

  location ~* ^/(wp-admin|wp-login|xmlrpc\.php|\.env|\.git) {
    deny all;
    return 404;
  }

  # ── Favicon / robots ───────────────────────────────────────────
  location = /favicon.ico {
    proxy_pass http://web;
    access_log off;
    log_not_found off;
  }

  location = /robots.txt {
    proxy_pass http://web;
    access_log off;
    log_not_found off;
  }
}
